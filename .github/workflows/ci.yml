name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm run build
      - run: npm run test
      - run: npx tsc --noEmit -p .

  # DEPLOY-001: publish the exact reviewed main SHA as an immutable container
  # image to GHCR, per the canonical TARGET STACK ("build once from an exact
  # reviewed SHA ... as an immutable container image through GitHub Actions +
  # GHCR"). Only runs after build-and-test passes on main; never on a PR, and
  # never rebuilds a different commit under the same tag.
  publish-image:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # OCI image names must be lowercase; github.repository keeps the
      # owner's casing (Jay-prodesign), which buildx rejects as a tag.
      - run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:main
